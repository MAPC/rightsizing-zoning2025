[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "rightsizing_zoning_analysis"
version = "0.0.1"
description = "Code bases for zoning nonconformity analysis 2025"
authors = [
  { name = "Zoe Iacovino" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
requires-python = "~=3.12"

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.ruff.lint.isort]
known_first_party = ["rightsizing_zoning_analysis"]
force_sort_within_sections = true
